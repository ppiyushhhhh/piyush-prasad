name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Record run in monitoring dashboard
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          INGEST_URL: ${{ secrets.MONITORING_INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.MONITORING_INGEST_TOKEN }}
        run: |
          [ -n "$INGEST_URL" ] && [ -n "$INGEST_TOKEN" ] || { echo "Ingestion not configured; skipping."; exit 0; }
          curl --fail-with-body -sS -X POST "$INGEST_URL" \
            -H "authorization: Bearer $INGEST_TOKEN" \
            -H "content-type: application/json" \
            -d "$(jq -n \
              --arg wf "${{ github.workflow }}" \
              --arg st "completed" \
              --arg cc "${{ job.status }}" \
              --arg sha "${{ github.sha }}" \
              --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{events:[{kind:"deployment",provider:"github-actions",workflow_name:$wf,status:$st,conclusion:$cc,commit_sha:$sha,url:$url}]}')" \
            
